    /* ===== Semantic color tokens (Apple HIG: Color / Dark Mode / Accessibility contrast ≥ 4.5:1) ===== */
    [data-t=dark] {
      color-scheme: dark;
      --bg: #080D12;
      --pn: #0D141B;
      --p2: #111A22;
      --ln: #263845;
      --tx: #EDF6FB;
      --mu: #8EA1AD;
      --ac: #33C3EC;
      --ik: #06202A;
      --bad: #F08A8A;
      --th: #26394A
    }

    [data-t=light] {
      color-scheme: light;
      --bg: #EEF2F5;
      --pn: #FFFFFF;
      --p2: #F5F8FA;
      --ln: #D3DEE5;
      --tx: #17232D;
      --mu: #5B6E7A;
      --ac: #087493;
      --ik: #FFFFFF;
      --bad: #C62828;
      --th: #FFFFFF
    }

    /* ===== Type scale: HIG text styles, iOS "Large (default)". Sizes in rem so browser text-size settings scale them (Dynamic Type) ===== */
    :root {
      --font: Arad, Oswald, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --fs-lt: 2.125rem;
      --lh-lt: 2.5625rem;
      /* Large Title 34/41 */
      --fs-t1: 1.75rem;
      --lh-t1: 2.125rem;
      /* Title 1 28/34 */
      --fs-t2: 1.375rem;
      --lh-t2: 1.75rem;
      /* Title 2 22/28 */
      --fs-t3: 1.25rem;
      --lh-t3: 1.5625rem;
      /* Title 3 20/25 */
      --fs-bd: 1.0625rem;
      --lh-bd: 1.375rem;
      /* Body / Headline 17/22 */
      --fs-sh: .9375rem;
      --lh-sh: 1.25rem;
      /* Subheadline 15/20 */
      --fs-fn: .8125rem;
      --lh-fn: 1.125rem;
      /* Footnote 13/18 */
      --fs-c1: .75rem;
      --lh-c1: 1rem;
      /* Caption 1 12/16 */
      --ctl: 32px;
      --r-ctl: 8px;
      /* control height (desktop default ≥ 28) and control radius */
    }

    * {
      box-sizing: border-box
    }

    html {
      font-size: 100%;
      -webkit-text-size-adjust: 100%
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 400 var(--fs-bd)/var(--lh-bd) var(--font)
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 2px
    }

    svg {
      width: 18px;
      height: 18px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    /* ===== Toolbar: leading (identity) · center (view switch) · trailing (actions) ===== */
    .bar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      min-height: 52px;
      padding: 8px;
      padding-inline: max(16px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
      padding-top: max(8px, env(safe-area-inset-top, 0px));
      background: var(--pn);
      border-bottom: 1px solid var(--ln)
    }

    .lead,
    .trail {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0
    }

    .trail {
      justify-self: end
    }

    .brand img {
      width: 28px;
      height: 28px;
      object-fit: contain
    }

    .title {
      font-size: var(--fs-bd);
      line-height: var(--lh-bd);
      font-weight: 600;
      white-space: nowrap
    }

    .sep {
      width: 1px;
      height: 20px;
      background: var(--ln);
      margin-inline: 8px
    }

    .bar .b {
      background: none;
      border-color: transparent
    }

    .bar .b:hover {
      background: var(--p2);
      border-color: transparent
    }

    .bar .b.pri {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--ik)
    }

    .bar .b.pri:hover {
      background: var(--ac);
      filter: brightness(1.08)
    }

    /* ===== Buttons (always with a press state) ===== */
    .b {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--ln);
      background: var(--p2);
      border-radius: var(--r-ctl);
      padding: 0 12px;
      min-height: var(--ctl);
      font-size: var(--fs-sh);
      line-height: var(--lh-sh);
      cursor: pointer;
      white-space: nowrap
    }

    .b:hover {
      border-color: var(--ac)
    }

    .b:active {
      filter: brightness(.88)
    }

    .pri {
      background: var(--ac);
      border-color: var(--ac);
      color: var(--ik);
      font-weight: 600
    }

    .sq {
      width: var(--ctl);
      padding: 0
    }

    /* ===== Segmented control ===== */
    .seg {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: var(--bg);
      border: 1px solid var(--ln);
      border-radius: calc(var(--r-ctl) + 2px)
    }

    .seg button {
      border: 0;
      background: none;
      border-radius: var(--r-ctl);
      padding: 0 16px;
      min-width: 76px;
      min-height: calc(var(--ctl) - 6px);
      font-size: var(--fs-sh);
      line-height: var(--lh-sh);
      cursor: pointer
    }

    .seg button[aria-pressed=true] {
      background: var(--th);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .22)
    }

    /* ===== More menu ===== */
    .menu-wrap {
      position: relative
    }

    .menu {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-end: 0;
      min-width: 224px;
      padding: 6px;
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
      z-index: 20;
      display: flex;
      flex-direction: column
    }

    .menu[hidden] {
      display: none
    }

    .mi {
      display: block;
      width: 100%;
      text-align: start;
      border: 0;
      background: none;
      border-radius: 6px;
      padding: 0 12px;
      min-height: var(--ctl);
      font-size: var(--fs-sh);
      line-height: var(--lh-sh);
      cursor: pointer
    }

    .mi:hover,
    .mi:focus-visible {
      background: var(--ac);
      color: var(--ik);
      outline: 0
    }

    .mi.danger {
      color: var(--bad)
    }

    .mi.danger:hover,
    .mi.danger:focus-visible {
      background: var(--bad);
      color: var(--pn)
    }

    .menu hr {
      border: 0;
      border-top: 1px solid var(--ln);
      margin: 6px 0;
      width: 100%
    }

    .only-sm {
      display: none
    }

    #stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: hidden
    }

    #fit {
      position: relative
    }

    /* ===== Board canvas: MacBook Air logical width 1440, iPhone logical 393x852, 4/8pt spacing ===== */
    .sheet {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      width: 1440px;
      min-height: 900px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: var(--bg);
      color: var(--tx);
      border: 1px solid var(--ln);
      font-family: var(--font)
    }

    .sheet[data-dev=phone] {
      width: 393px;
      min-height: 852px;
      padding: 16px;
      gap: 16px
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .hd img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: var(--rad);
      padding: 8px
    }

    .hd b {
      display: block;
      font-size: var(--fs-lt);
      line-height: var(--lh-lt);
      font-weight: 700
    }

    .hd small {
      color: var(--mu);
      font-size: var(--fs-sh);
      line-height: var(--lh-sh)
    }

    .hd .logo {
      position: relative;
      flex: none;
      display: block;
      padding: 0;
      border: 0;
      background: none;
      border-radius: var(--rad);
      cursor: pointer;
      line-height: 0
    }

    .hd .logo .ov {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: var(--rad);
      background: rgba(0, 0, 0, .55);
      color: #fff;
      opacity: 0
    }

    .hd .logo:hover .ov,
    .hd .logo:focus-visible .ov {
      opacity: 1
    }

    .hd .bn {
      width: fit-content;
      max-width: 100%;
      outline: 0;
      cursor: text;
      border-bottom: 1px dashed transparent
    }

    .hd .bn:hover {
      border-bottom-color: var(--ln)
    }

    .hd .bn:focus {
      border-bottom-color: var(--ac)
    }

    #secs {
      display: grid;
      grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
      gap: 24px;
      align-items: stretch
    }

    .sheet[data-dev=phone] #secs {
      gap: 16px
    }

    .sec {
      background: var(--pn);
      border: var(--bw, 1px) solid var(--bc, var(--ln));
      box-shadow: var(--sd, none);
      border-radius: var(--rad);
      padding: 24px;
      height: 100%;
      box-sizing: border-box
    }

    .sheet[data-dev=phone] .sec {
      padding: 16px
    }

    .sh {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px
    }

    .t {
      flex: 1;
      min-width: 0;
      display: block;
      font-size: var(--fs-t3);
      line-height: var(--lh-t3);
      font-weight: 600;
      background: none;
      border: 0;
      border-bottom: 1px solid transparent;
      padding: 4px 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    input.t:hover,
    input.t:focus {
      border-bottom-color: var(--ln)
    }

    .sw {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 16px
    }

    .chip {
      display: block;
      position: relative;
      height: 72px;
      border-radius: var(--rad);
      border: 1px solid var(--ln);
      cursor: pointer;
      overflow: hidden
    }

    .pk {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: 0;
      padding: 0
    }

    .n {
      display: block;
      width: 100%;
      background: none;
      border: 0;
      padding: 8px 0 0;
      font-size: var(--fs-sh);
      line-height: var(--lh-sh);
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .hx {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .h {
      flex: 1;
      min-width: 0;
      display: block;
      width: 100%;
      background: none;
      border: 0;
      padding: 4px 0;
      font: 500 var(--fs-fn)/var(--lh-fn) var(--mono);
      color: var(--mu);
      direction: ltr;
      text-align: left
    }

    .h.bad {
      color: var(--bad);
      text-decoration: underline wavy
    }

    .x {
      display: inline-grid;
      place-items: center;
      border: 0;
      background: none;
      color: var(--mu);
      cursor: pointer;
      width: var(--ctl);
      height: var(--ctl);
      border-radius: var(--r-ctl);
      flex: none
    }

    .x:hover {
      color: var(--bad);
      background: var(--p2)
    }

    .x:active {
      filter: brightness(.8)
    }

    .add {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 16px;
      padding: 12px;
      border: 1px dashed var(--ac);
      border-radius: var(--rad)
    }

    .add input[type=color] {
      width: 44px;
      height: var(--ctl);
      padding: 2px;
      border: 1px solid var(--ln);
      border-radius: var(--r-ctl);
      background: var(--p2)
    }

    .add input[type=text],
    .add select {
      height: var(--ctl);
      padding: 0 12px;
      border: 1px solid var(--ln);
      border-radius: var(--r-ctl);
      background: var(--p2);
      font-size: var(--fs-fn)
    }

    .add input[type=text] {
      flex: 1;
      min-width: 96px
    }

    .add input.bad {
      border-color: var(--bad);
      color: var(--bad)
    }

    .hint {
      margin: 0;
      color: var(--mu);
      font-size: var(--fs-sh);
      line-height: var(--lh-sh)
    }

    .fl {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px
    }

    .fc {
      position: relative;
      padding: 16px;
      background: var(--p2);
      border: var(--bw, 1px) solid var(--bc, var(--ln));
      border-radius: var(--rad)
    }

    .fn {
      font-size: var(--fs-t2);
      line-height: var(--lh-t2);
      font-weight: 600
    }

    .fs {
      font-size: var(--fs-bd);
      line-height: var(--lh-bd);
      margin: 8px 0
    }

    .lg {
      color: var(--mu);
      font-size: var(--fs-c1);
      line-height: var(--lh-c1)
    }

    .fc .x {
      position: absolute;
      top: 8px;
      inset-inline-end: 8px
    }

    .tk {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: start
    }

    .sheet[data-dev=phone] .tk {
      grid-template-columns: 1fr;
      gap: 16px
    }

    .tl {
      display: grid;
      gap: 16px
    }

    .ti {
      padding: 16px;
      background: var(--p2);
      border: var(--bw, 1px) solid var(--bc, var(--ln));
      border-radius: var(--rad)
    }

    .ti .sh {
      margin-bottom: 12px
    }

    .ti .pv {
      background: var(--pn)
    }

    .tn {
      flex: 1;
      min-width: 0;
      display: block;
      font-size: var(--fs-sh);
      line-height: var(--lh-sh);
      font-weight: 600;
      background: none;
      border: 0;
      border-bottom: 1px solid transparent;
      padding: 4px 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    input.tn:hover,
    input.tn:focus {
      border-bottom-color: var(--ln)
    }

    .ti .b:not(.sq) {
      min-height: 28px;
      padding: 0 12px;
      font-size: var(--fs-fn);
      line-height: var(--lh-fn)
    }

    .ti .sq {
      width: 28px;
      min-height: 28px
    }

    .pv {
      height: 64px;
      background: var(--p2);
      border-radius: var(--rad);
      border: var(--bw, 1px) solid var(--bc, var(--ln));
      box-shadow: var(--sd, none)
    }

    .cd {
      display: block;
      direction: ltr;
      text-align: left;
      font: 400 var(--fs-c1)/var(--lh-c1) var(--mono);
      color: var(--mu);
      margin-top: 12px;
      word-break: break-all
    }

    .ctl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px
    }

    .lb {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: var(--fs-c1);
      line-height: var(--lh-c1);
      color: var(--mu)
    }

    .ctl input {
      width: 64px;
      height: var(--ctl);
      border: 1px solid var(--ln);
      border-radius: var(--r-ctl);
      background: var(--p2);
      padding: 0 8px;
      font-size: var(--fs-fn)
    }

    .ctl input[type=color] {
      width: 44px;
      padding: 2px
    }

    .tk input[type=range] {
      display: block;
      width: 100%;
      height: var(--ctl);
      margin: 12px 0 0;
      accent-color: var(--ac)
    }

    #toast {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      background: var(--ac);
      color: var(--ik);
      padding: 8px 16px;
      border-radius: var(--r-ctl);
      font-size: var(--fs-sh);
      line-height: var(--lh-sh);
      font-weight: 600;
      visibility: hidden;
      z-index: 30
    }

    /* ===== Adaptation ===== */
    @media(max-width:700px) {

      .hide-sm,
      .title {
        display: none !important
      }

      .only-sm {
        display: block
      }

      .bar {
        gap: 8px
      }

      .seg button {
        min-width: 64px;
        padding: 0 12px
      }
    }

    @media(pointer:coarse) {

      .bar .b,
      .mi {
        min-height: 44px
      }

      .bar .sq {
        width: 44px
      }

      .seg button {
        min-height: 38px
      }

      .sheet .b,
      .sheet .x {
        position: relative
      }

      .sheet .b::after,
      .sheet .x::after {
        content: "";
        position: absolute;
        inset: -8px
      }
    }

    @media(prefers-reduced-motion:no-preference) {

      .b,
      .mi,
      .seg button,
      .x {
        transition: background-color .15s, border-color .15s, color .15s
      }
    }

    @media(prefers-contrast:more) {
      [data-t=dark] {
        --ln: #6B8798;
        --mu: #B8C7D0
      }

      [data-t=light] {
        --ln: #7A8D99;
        --mu: #42535E
      }
    }
  </style>
  <style id="uf"></style>
</head>

  <script>
    const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ic = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
    const I = {
      plus: ic('<path d="M12 5v14M5 12h14"/>'), x: ic('<path d="M6 6l12 12M18 6L6 18"/>'), copy: ic('<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/>'),
      sun: ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'), moon: ic('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>')
    };
    const sysT = () => { try { return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark' } catch (e) { return 'dark' } };
    const HEX = /^#[0-9a-f]{6}$/i, KEY = 'teconize-pattern-v3';
    const S = (n, ...c) => ({ n, c: c.map(([n, h]) => ({ n, h })) });
    const B0 = () => ({ n: 'Teconize', l: null });
    const DEF = () => ({ t: sysT(), brand: B0(), rads: [{ n: 'Radius 1', v: 14 }], rA: 0, bords: [{ n: 'Border 1', w: 1, c: '' }], bA: 0, shads: [{ n: 'Shadow 1', x: 0, y: 12, b: 30, s: 0, c: '#000000', o: .35 }], sA: 0, fonts: [{ n: 'آراد', f: 'Arad', l: 'fa' }, { n: 'Oswald', f: 'Oswald', l: 'en' }], secs: [S('Primary', ['Primary', '#33C3EC'], ['Secondary', '#6EE7A8']), S('Text', ['Light', '#EDF6FB'], ['Muted', '#9A9FA6']), S('Background', ['Ink', '#080D12'], ['Surface', '#111A22'], ['Paper', '#F5F6F7']), S('Accent', ['Coral', '#F08A8A'], ['Soft Blue', '#B8EAF8'])] });
    let fopen = false, d = DEF(), dev = innerWidth < 700 ? 'phone' : 'laptop', open = -1;
    function norm(x) {
      const o = { ...DEF(), ...x };
      o.fonts = [...DEF().fonts, ...(Array.isArray(x.fonts) ? x.fonts : []).filter(f => f && f.u)];
      o.brand = { ...B0(), ...(x.brand && typeof x.brand === 'object' ? x.brand : {}) };
      if (typeof o.brand.n !== 'string' || !o.brand.n.trim()) o.brand.n = B0().n;
      if (!(typeof o.brand.l === 'string' && /^data:image\//.test(o.brand.l))) o.brand.l = null;
      if (!Array.isArray(x.rads) && x.rad != null) o.rads = [{ n: 'Radius 1', v: +x.rad || 0 }];
      if (!Array.isArray(x.bords) && x.bw != null) o.bords = [{ n: 'Border 1', w: +x.bw || 0, c: x.bc || '' }];
      if (!Array.isArray(x.shads) && x.sh) o.shads = [{ n: 'Shadow 1', ...x.sh }];
      ['rad', 'bw', 'bc', 'sh'].forEach(k => delete o[k]);
      [['rads', 'rA'], ['bords', 'bA'], ['shads', 'sA']].forEach(([k, a]) => { if (!Array.isArray(o[k])) o[k] = []; o[a] = Math.min(Math.max(0, +o[a] || 0), Math.max(0, o[k].length - 1)) });
      return o
    }
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.secs)) d = norm(s) } catch (e) { }
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(d)) } catch (e) { if (!persist.w) { persist.w = 1; toast('حافظهٔ مرورگر پر است؛ از «ذخیره JSON» استفاده کن') } } };
